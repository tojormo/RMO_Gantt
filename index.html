<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WBS Timeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b2a5b; --ink2:#2b4a7a; --mute:#7a8fae; --hair:#dfe7f3; --hair2:#c3d2e8; --paper:#ffffff; --tint:#f2f6fc;
  --lv1:#1e4fa3; --lv2:#5b8bd6; --lv3:#b3cdf0;
  --accent:#e4002b;
  --key:#0e8a7e; --keybg:#e2f3f0;   /* 報告（mark=1）のハイライト色 */
  --dis:#ba42f2; --disbg:#f8edfe;   /* 議論（mark=2）のハイライト色 */
  --left:340px; --h1:56px; --h2:46px; --h3:40px;
  --font:"Inter","Noto Sans JP",-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;
}
@media (max-width:640px){ :root{ --left:168px; --h1:58px; --h2:50px; --h3:46px; } }
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;letter-spacing:.01em}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}

/* ===== Header ===== */
.hd{display:flex;align-items:center;gap:24px;padding:12px 28px;padding-top:calc(12px + env(safe-area-inset-top));border-bottom:1px solid var(--ink)}
.hd .brand{flex:0 1 auto;min-width:0}
.eyebrow{font-size:10px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--mute)}
.hd h1{margin:0;font-size:16px;font-weight:900;line-height:1.2;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .upd{font-size:10px;color:var(--mute);margin-top:2px;letter-spacing:.06em;white-space:nowrap}
.txtbtn{background:none;border:0;padding:6px 0;font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);position:relative}
.txtbtn::after{content:"";position:absolute;left:0;right:100%;bottom:2px;height:1px;background:var(--ink);transition:right .25s}
.txtbtn:hover::after,.txtbtn.on::after{right:0}
.hd nav{display:flex;gap:18px;margin-left:auto}

/* ===== KPI ===== */
.stats{display:flex;align-items:center;border-left:1px solid var(--hair2)}
.stat{display:flex;align-items:baseline;gap:6px;padding:0 16px;border-right:1px solid var(--hair)}
.stat:last-child{border-right:0}
.stat .n{font-size:16px;font-weight:800;line-height:1;font-feature-settings:"tnum"}
.stat .l{font-size:9px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.stat.alert .n{color:var(--accent)}

@media (max-width:640px){
  .hd{padding:8px 16px;padding-top:calc(8px + env(safe-area-inset-top))}
  .hd .brand,.stats{display:none}
  .hd nav{gap:14px}
}

/* ===== Toolbar ===== */
.tb{display:flex;flex-wrap:wrap;align-items:center;gap:6px 22px;padding:10px 28px;border-bottom:1px solid var(--hair)}
.tb .grp{display:flex;gap:14px;align-items:center}
.tb .sep{width:1px;height:14px;background:var(--hair2)}
.search{flex:1;min-width:140px;border:0;border-bottom:1px solid var(--hair2);height:32px;font-size:16px;padding:0 2px;outline:none;background:transparent}
.search:focus{border-bottom-color:var(--ink)}
@media (min-width:641px){ .search{font-size:13px} }
.legend{display:flex;gap:14px;align-items:center;font-size:10px;letter-spacing:.16em;color:var(--mute);font-weight:600}
.legend i{display:inline-block;width:18px;height:6px;margin-right:6px;vertical-align:middle}
.filters{display:none;width:100%;gap:12px 20px;flex-wrap:wrap;padding:8px 0 4px}
.filters.open{display:flex}
.filters .fld{display:flex;flex-direction:column;gap:4px;flex:1 1 150px;min-width:0;position:relative}
.filters .fl{font-size:9px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.filters label.chk{display:flex}
/* 複数選択ドロップダウン */
.ms-btn{width:100%;height:34px;border:0;border-bottom:1px solid var(--hair2);background:transparent;font-size:16px;padding:0 18px 0 2px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;letter-spacing:0}
.ms-btn::after{content:"▾";position:absolute;right:2px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--mute)}
.ms.open .ms-btn,.ms-btn:focus{border-bottom-color:var(--ink);outline:none}
.ms.on .ms-btn{font-weight:700}
@media (min-width:641px){ .ms-btn{font-size:13px} }
.ms-pop{display:none;position:absolute;left:0;top:100%;z-index:40;min-width:100%;width:max-content;max-width:min(320px,90vw);max-height:300px;overflow:auto;background:var(--paper);border:1px solid var(--ink);box-shadow:0 8px 24px rgba(11,42,91,.14);padding:6px 0}
.ms.open .ms-pop{display:block}
.ms-act{display:flex;gap:14px;padding:4px 12px 8px;border-bottom:1px solid var(--hair)}
.ms-act button{background:none;border:0;padding:2px 0;font-size:10px;font-weight:600;letter-spacing:.14em;color:var(--ink2)}
.ms-act button:hover{text-decoration:underline}
.ms-opt{display:flex;align-items:center;gap:8px;padding:7px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.ms-opt:hover{background:var(--tint)}
.ms-opt input{width:15px;height:15px;margin:0;accent-color:var(--ink)}
.ms-opt .bl0{color:var(--mute)}
.filters .chk{flex-direction:row;align-items:center;gap:8px;flex:0 0 auto;font-size:11px;letter-spacing:.1em;color:var(--ink)}
.filters .chk input{width:16px;height:16px;accent-color:var(--ink)}
@media (max-width:640px){ .tb{padding:8px 16px;gap:6px 14px} .legend{display:none} }

/* ===== Chart ===== */
.scroller{flex:1;min-height:0;overflow:auto;position:relative;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.chart{position:relative;min-height:100%}
.head{position:sticky;top:0;z-index:5;display:flex;background:var(--paper);border-bottom:1px solid var(--ink)}
.corner{position:sticky;left:0;z-index:6;width:var(--left);flex:0 0 var(--left);background:var(--paper);border-right:1px solid var(--hair);display:flex;align-items:flex-end;padding:0 16px 8px;font-size:9px;font-weight:600;letter-spacing:.2em;color:var(--mute)}
.scale{position:relative;flex:0 0 auto}
.months{position:relative;height:26px}
.month{position:absolute;top:0;height:100%;border-left:1px solid var(--hair2);padding:7px 8px 0;font-size:10px;font-weight:700;letter-spacing:.14em;white-space:nowrap;overflow:hidden}
.ticks{position:relative;height:28px}
.ticks.hide{display:none}
.tick{position:absolute;top:0;height:100%;font-size:9px;text-align:center;color:var(--mute);line-height:1.3;padding-top:2px;overflow:hidden;white-space:nowrap;font-feature-settings:"tnum"}
.tick.we{color:#a9bad3}
.tick.today{color:var(--paper);background:var(--ink);font-weight:700}
.body{position:relative}
.grid{position:absolute;top:0;bottom:0;pointer-events:none;z-index:0}
.grid .we{position:absolute;top:0;bottom:0;background:var(--tint)}
.grid .wl{position:absolute;top:0;bottom:0;border-left:1px solid #edf2f9}
.grid .ml{position:absolute;top:0;bottom:0;border-left:1px solid var(--hair2)}
.grid .td{position:absolute;top:0;bottom:0;width:1px;background:var(--accent)}

.row{display:flex;position:relative;z-index:1;cursor:pointer;border-bottom:1px solid var(--hair)}
.row.l1{height:var(--h1);border-top:1px solid var(--ink);border-bottom-color:var(--hair2)}
.row.l1:first-child{border-top:0}
.row.l2{height:var(--h2)}
.row.l3{height:var(--h3)}
.cl{position:sticky;left:0;z-index:3;width:var(--left);flex:0 0 var(--left);background:var(--paper);border-right:1px solid var(--hair);display:flex;align-items:center;gap:8px;padding:0 14px 0 0;overflow:hidden}
.row:hover .cl{background:var(--tint)}
.row:hover .ct{background:rgba(30,79,163,.04)}
.row.l1 .cl,.row.l1 .ct{background-image:repeating-linear-gradient(-45deg,color-mix(in srgb,var(--ink) 9%,transparent) 0 1.5px,transparent 1.5px 6px)}  /* LV1 のみ網掛け */
.row.l1 .cl{background-color:var(--tint)}
.ind{flex:0 0 auto}
.l1 .ind{width:14px}.l2 .ind{width:28px}.l3 .ind{width:42px}
@media (max-width:640px){ .l1 .ind{width:10px}.l2 .ind{width:18px}.l3 .ind{width:26px} }
.tg{flex:0 0 14px;width:14px;height:14px;display:flex;align-items:center;justify-content:center;font-size:9px;transition:transform .2s;color:var(--ink)}
.collapsed .tg{transform:rotate(-90deg)}
.tg.none{visibility:hidden}
.txt{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l1 .nm{font-size:14px;font-weight:900;letter-spacing:.02em}
.l2 .nm{font-size:13px;font-weight:700;color:var(--ink2)}
.l3 .nm{font-size:12.5px;font-weight:500;color:var(--ink2)}
.mt{font-size:10px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.04em;font-feature-settings:"tnum"}
.mt b{font-weight:600;color:var(--ink2)}
.tbd{display:inline-block;padding:0 5px;background:var(--accent);color:var(--paper);font-weight:700;letter-spacing:.08em;line-height:1.5}
.stat.tbdk .n{color:var(--paper);background:var(--accent);padding:2px 6px}
.flag{flex:0 0 auto;width:6px;height:6px;border-radius:50%;background:var(--accent)}
/* 論点インジケーター（備考に記入がある行） */
.iss{flex:0 0 auto;min-width:16px;height:16px;padding:0 3px;display:inline-flex;align-items:center;justify-content:center;background:var(--ink);color:var(--paper);font-size:10px;font-weight:800;line-height:1;letter-spacing:0;cursor:pointer;font-feature-settings:"tnum"}
.iss.sum{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.iss:hover{opacity:.8}
.tip{position:fixed;z-index:60;display:none;max-width:min(340px,90vw);padding:10px 12px;background:var(--paper);border:1px solid var(--ink);box-shadow:0 8px 24px color-mix(in srgb,var(--ink) 14%,transparent);font-size:12px;line-height:1.6;color:var(--ink);pointer-events:none}
.tip.open{display:block}
.tip .th{font-size:9px;font-weight:600;letter-spacing:.2em;color:var(--mute);margin-bottom:4px}
.tip .ti{white-space:pre-wrap;word-break:break-word}
.tip .ti+.ti{margin-top:6px;padding-top:6px;border-top:1px solid var(--hair)}
.tip .tw{font-weight:700;color:var(--ink2);margin-right:6px}
.ct{position:relative;flex:0 0 auto}
.br{position:absolute;top:50%;transform:translateY(-50%);min-width:3px}
.l1 .br{height:20px;background:var(--lv1)}
.l2 .br{height:14px;background:var(--lv2)}
.l3 .br{height:12px;background:var(--lv3)}
.row.key .cl,.row.key:hover .cl{background:var(--keybg);box-shadow:inset 4px 0 0 var(--key)}
.row.key .ct{background:color-mix(in srgb,var(--key) 7%,transparent)}
.row.key .nm{font-weight:800;color:var(--ink)}
.row.key .br{background:var(--key);box-shadow:0 0 0 2px color-mix(in srgb,var(--key) 25%,transparent)}
.l3.key .br,.l2.key .br{height:16px}
.row.key .bl{color:var(--ink);font-weight:800}
.tag.key{background:var(--key);border-color:var(--key);color:var(--paper)}
/* 議論（mark=2） */
.row.dis .cl,.row.dis:hover .cl{background:var(--disbg);box-shadow:inset 4px 0 0 var(--dis)}
.row.dis .ct{background:color-mix(in srgb,var(--dis) 7%,transparent)}
.row.dis .nm{font-weight:800;color:var(--ink)}
.row.dis .br{background:var(--dis);box-shadow:0 0 0 2px color-mix(in srgb,var(--dis) 25%,transparent)}
.l3.dis .br,.l2.dis .br{height:16px}
.row.dis .bl{color:var(--ink);font-weight:800}
.tag.dis{background:var(--dis);border-color:var(--dis);color:var(--paper)}
.br.done{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.55) 0 2px,transparent 2px 5px)}
.br.over::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:2px;background:var(--accent)}
.br .pg{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.28)}
.bl{position:absolute;top:50%;transform:translateY(-50%);white-space:nowrap;pointer-events:none;font-size:10.5px;color:var(--ink2);letter-spacing:.02em}
.l1 .bl{font-weight:800;color:var(--ink)}
.l2 .bl{font-weight:600}
.l3 .bl{color:var(--mute)}
.nodate{position:absolute;top:50%;transform:translateY(-50%);font-size:10px;color:var(--mute);letter-spacing:.1em}

.empty,.errbox{padding:64px 20px;text-align:center;font-size:13px;color:var(--mute);letter-spacing:.06em}
.errbox{color:var(--accent)}

/* ===== Overlays ===== */
.ov{position:fixed;inset:0;display:none;z-index:50;background:rgba(242,246,252,.88);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:20px}
.ov.open{display:flex}
.login{width:100%;max-width:380px;border-top:3px solid var(--ink);padding-top:22px}
.login h2{margin:8px 0 22px;font-size:30px;font-weight:900;letter-spacing:-.01em;line-height:1.1}
.login input{width:100%;height:46px;border:0;border-bottom:1px solid var(--ink);font-size:16px;outline:none;background:transparent;padding:0 2px}
.login .msg{min-height:20px;font-size:12px;color:var(--accent);margin:10px 0}
.pbtn{width:100%;height:50px;border:0;background:var(--ink);color:var(--paper);font-size:12px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;transition:opacity .2s}
.pbtn:hover{opacity:.82}

.dov{align-items:flex-end;padding:0;background:rgba(11,42,91,.35);backdrop-filter:none;-webkit-backdrop-filter:none}
@media (min-width:641px){ .dov{align-items:stretch;justify-content:flex-end} }
.dt{background:var(--paper);width:100%;max-height:86dvh;overflow:auto;padding:22px 22px calc(24px + env(safe-area-inset-bottom));border-top:3px solid var(--ink);animation:up .25s ease}
@media (min-width:641px){ .dt{max-width:440px;max-height:none;height:100%;border-top:0;border-left:3px solid var(--ink);animation:sl .25s ease} }
@keyframes up{from{transform:translateY(30px);opacity:0}}
@keyframes sl{from{transform:translateX(30px);opacity:0}}
.dt h3{margin:8px 0 14px;font-size:24px;font-weight:900;line-height:1.2}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.tag{font-size:10px;font-weight:600;letter-spacing:.14em;padding:4px 8px;border:1px solid var(--ink)}
.tag.inv{background:var(--ink);color:var(--paper)}
.tag.al{border-color:var(--accent);color:var(--accent)}
.issbox{margin:0 0 20px;padding:12px 14px;border-left:3px solid var(--ink);background:var(--tint)}
.issbox .th{font-size:9px;font-weight:600;letter-spacing:.2em;color:var(--mute);margin-bottom:6px}
.issbox .ti{font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.issbox .ti+.ti{margin-top:8px;padding-top:8px;border-top:1px solid var(--hair2)}
.issbox .tw{font-weight:700;margin-right:6px}
.kv{margin:0;border-top:1px solid var(--ink)}
.kv div{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--hair)}
.kv dt{font-size:9px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);padding-top:3px}
.kv dd{margin:0;font-size:14px;white-space:pre-wrap;word-break:break-word}
.kv .auto{font-size:9px;letter-spacing:.14em;color:var(--mute);margin-left:6px}
.dt .pbtn{margin-top:22px}

.loading{position:fixed;left:0;right:0;top:0;height:2px;z-index:60;display:none;overflow:hidden}
.loading.on{display:block}
.loading i{position:absolute;top:0;bottom:0;width:30%;background:var(--ink);animation:ld 1s ease-in-out infinite}
@keyframes ld{from{left:-30%}to{left:100%}}
</style>
</head>
<body>
<div class="loading" id="loading"><i></i></div>
<div class="app">
  <header class="hd">
    <div class="brand">
      <h1 id="title">—</h1>
      <div class="upd" id="updated">&nbsp;</div>
    </div>
    <div class="stats" id="stats"></div>
    <nav>
      <button class="txtbtn" id="btnReload">Reload</button>
      <button class="txtbtn" id="btnLogout">Logout</button>
    </nav>
  </header>

  <div class="tb">
    <div class="grp" id="zoom">
      <button class="txtbtn" data-z="day">Day</button>
      <button class="txtbtn" data-z="week">Week</button>
      <button class="txtbtn" data-z="month">Month</button>
    </div>
    <span class="sep"></span>
    <div class="grp">
      <button class="txtbtn" id="btnToday">Today</button>
      <button class="txtbtn" id="btnL1" title="LV1のみ表示">LV1</button>
      <button class="txtbtn" id="btnL2" title="LV2まで表示">LV2</button>
      <button class="txtbtn" id="btnL3" title="すべて展開">All</button>
      <button class="txtbtn" id="btnFilter">Filter</button>
    </div>
    <div class="legend">
      <span><i style="background:var(--key)"></i>報告</span>
      <span><i style="background:var(--dis)"></i>議論</span>
      <span><i style="background:var(--lv1)"></i>LV1</span>
      <span><i style="background:var(--lv2)"></i>LV2</span>
      <span><i style="background:var(--lv3)"></i>LV3</span>
    </div>
    <input type="search" class="search" id="q" placeholder="Search">
    <div class="filters" id="filters">
      <div class="fld"><span class="fl">Category</span><div class="ms" id="fCategory" data-k="category"></div></div>
      <div class="fld"><span class="fl">Task</span><div class="ms" id="fTask" data-k="task"></div></div>
      <div class="fld"><span class="fl">Owner</span><div class="ms" id="fOwner" data-k="owner"></div></div>
      <div class="fld"><span class="fl">Status</span><div class="ms" id="fStatus" data-k="status"></div></div>
      <label class="chk"><input type="checkbox" id="onlyOverdue">期限超過のみ</label>
      <button class="txtbtn" id="btnClear" title="フィルタを初期状態に戻す">Reset</button>
    </div>
  </div>

  <div class="scroller" id="scroller"><div class="chart" id="chart"></div></div>
</div>

<div class="ov" id="loginOv">
  <form class="login" id="loginForm">
    <div class="eyebrow">Restricted Access</div>
    <h2>Enter<br>Password.</h2>
    <input type="password" id="pw" autocomplete="current-password" placeholder="Password" required>
    <div class="msg" id="loginMsg"></div>
    <button class="pbtn" type="submit">View Timeline</button>
  </form>
</div>

<div class="ov dov" id="detailOv"><div class="dt" id="detail"></div></div>
<div class="tip" id="tip"></div>

<script>
/* 外部ホスティング時のみ GASウェブアプリURL(/exec) を設定。GASから開く場合は空のまま */
const API_URL = 'https://script.google.com/macros/s/AKfycbxz9LsWMF19uylm_T7s3-150QOUiMbcUg98UxoVwD9H8-zPWDxdypJplFYwXVIELGU3hA/exec';
const PW_KEY = 'gantt_pw', PREF_KEY = 'gantt_prefs_v4';
const DAY = 86400000;
const ZOOMS = { day: 28, week: 10, month: 3.5 };
const WD = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
const WDJ = ['日','月','火','水','木','金','土'];
const ST_LABEL = { todo:'未着手', doing:'進行中', done:'完了', late:'遅延', hold:'保留', other:'—' };
/* フィールド名 → スプレッドシートのヘッダー名（列名が変わったらここだけ直す） */
const FIELDS = { wbs:'WBS', mark:'mark', category:'Category', task:'タスク', subtask:'サブタスク',
  owner:'タスクオーナー', start:'開始日', end:'終了日', status:'Status', kpi:'KPI', note:'備考' };
/* 必須列（無ければエラー）。それ以外の列は無くても空として扱う */
const REQUIRED = ['wbs', 'category', 'task', 'subtask', 'start', 'end'];
/* 表示名：LV1=Category / LV2=タスク / LV3=サブタスク（空なら隣の列で補完） */
const NAME_BY_LEVEL = { 1: ['category', 'subtask', 'task'], 2: ['task', 'subtask'], 3: ['subtask', 'task'] };
/* mark列がこの値ならハイライト（全角・前後空白は吸収） */
/* タスクオーナーが未定かどうか（TBD／全角・小文字も吸収） */
const isTBD = (v) => String(v || '').normalize('NFKC').trim().toUpperCase() === 'TBD';
/* 担当者表示：TBDなら赤地で強調 */
const ownerHtml = (v) => isTBD(v) ? `<span class="tbd">${esc(v)}</span>` : esc(v);
/* mark欄：1=報告、2=議論 */
const markType = (v) => ({ '1': 'rep', '2': 'dis' })[String(v || '').normalize('NFKC').trim()] || '';
const MARK = { rep: { cls: 'key', label: '報告' }, dis: { cls: 'dis', label: '議論' } };
/* 複数選択フィルタ：配列が空なら「すべて」。statusDefault=true の間は初期値（Pending・Closeを除外）を適用 */
const MULTI = ['category', 'task', 'owner', 'status'];
const BLANK = '';                       // Status 空欄を表す値
const BLANK_LABEL = '(空欄)';
const DEFAULT_EXCLUDE_SK = ['hold', 'done'];   // 既定で除外するステータス（Pending / Close）
const newFilter = () => ({ category:[], task:[], owner:[], status:[], statusDefault:true, q:'', onlyOverdue:false });
const $ = (id) => document.getElementById(id);
const S = {
  roots: [], all: [], leaves: [],
  zoom: innerWidth <= 640 ? 'week' : 'day',
  f: newFilter(), opts: {},
  collapsed: new Set(), toToday: true, range: null,
};
const TODAY = (() => { const n = new Date(); return Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()) / DAY; })();

document.addEventListener('DOMContentLoaded', () => {
  loadPrefs(); bindUI();
  const pw = localStorage.getItem(PW_KEY);
  pw ? fetchData(pw) : showLogin();
});

/* ================= API ================= */
function callApi(password) {
  if (window.google && google.script && google.script.run) {
    return new Promise((ok, ng) => google.script.run.withSuccessHandler(ok).withFailureHandler(ng).getData(password));
  }
  if (!API_URL) return Promise.reject(new Error('API_URL が設定されていません'));
  return fetch(API_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify({ password }), cache:'no-store', redirect:'follow' })
    .then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
}
/* GASの行(ヘッダー名キー)をフロントのフィールド名に変換 */
function toTasks(res) {
  const headers = res.headers || [];
  const missing = REQUIRED.map((k) => FIELDS[k]).filter((h) => !headers.includes(h));
  if (missing.length) throw new Error('ヘッダーが見つかりません: ' + missing.join(', '));
  return (res.rows || []).map((r) => {
    const t = { row: r._row };
    for (const k in FIELDS) t[k] = r[FIELDS[k]] || '';
    t.mk = markType(t.mark);
    // 備考の「Sub: 〇〇」をサブ担当として分離（残りは備考に残す）
    const m = t.note.match(/Sub\s*[:：]\s*([^/／\n]+)/i);
    t.sub = m ? m[1].trim() : '';
    t.note = m ? t.note.replace(m[0], '').replace(/^[\s/／]+|[\s/／]+$/g, '') : t.note;
    t.issue = String(r['論点'] || t.note || '').trim();   // 論点：「論点」列があれば優先、無ければ備考
    return t;
  });
}
async function fetchData(pw) {
  setLoading(true);
  try {
    const res = await callApi(pw);
    if (!res || !res.ok) {
      if (res && (res.error === 'AUTH' || res.error === 'LOCKED')) { localStorage.removeItem(PW_KEY); showLogin(res.message); return; }
      throw new Error((res && res.message) || 'データ取得に失敗しました');
    }
    const tasks = toTasks(res);
    localStorage.setItem(PW_KEY, pw);
    hideLogin();
    $('title').textContent = res.title || 'Timeline';
    document.title = res.title || 'WBS Timeline';
    buildTree(tasks);
    $('updated').textContent = 'Updated ' + res.updatedAt;
    buildFilterOptions();
    render();
  } catch (e) {
    hideLogin();
    showError(e.message || String(e));
  } finally { setLoading(false); }
}

/* ================= WBS Tree ================= */
/* 'yyyy-MM-dd' / 'yyyy/M/d' / 'yyyy年M月d日' など → 日数（UTC）。解釈できなければ null */
function toNum(s) {
  const m = String(s || '').match(/^(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  return m ? Date.UTC(m[1], m[2] - 1, m[3]) / DAY : null;
}
const fromNum = (n) => new Date(n * DAY);
function fmt(n, full) {
  if (n == null) return '';
  const d = fromNum(n), md = (d.getUTCMonth() + 1) + '/' + d.getUTCDate();
  return full ? d.getUTCFullYear() + '/' + md + ' (' + WDJ[d.getUTCDay()] + ')' : md;
}
function statusKey(s) {
  const v = (s || '').toLowerCase();
  if (!v) return 'todo';
  if (/未着手|未開始|未完了|todo|not ?started|incomplete|open/.test(v)) return 'todo'; // 「未完了」が「完了」に誤判定されないよう先に判定
  if (/完了|済|done|complete|closed?/.test(v)) return 'done';   // 「Close」も完了扱い
  if (/遅延|遅れ|delay|late|overdue/.test(v)) return 'late';
  if (/保留|中止|中断|hold|pending|cancel/.test(v)) return 'hold';
  if (/進行|着手|対応中|作業中|実施中|progress|doing|wip/.test(v)) return 'doing';
  return 'other';
}
const isOpenWip = (s) => /^(open|wip)$/i.test(String(s || '').normalize('NFKC').trim());
/* "1" → LV1, "1.2" → LV2, "1.2.3" → LV3（"1.0.0"や"1.2.0"のような末尾0は上位扱い） */
function parseWbs(w) {
  const segs = String(w || '').normalize('NFKC').trim().replace(/。/g, '.').split(/[.\-]/).map((s) => s.trim()).filter(Boolean);
  while (segs.length > 1 && /^0+$/.test(segs[segs.length - 1])) segs.pop();
  return segs.slice(0, 3);
}
const lastSeg = (n) => n.segs[n.segs.length - 1];
function buildTree(rows) {
  const map = new Map(), all = [];
  const add = (o) => {
    const n = { children: [], virtual: false, ...o };
    if (!n.name) n.name = (NAME_BY_LEVEL[n.level] || NAME_BY_LEVEL[3]).map((k) => n[k]).find(Boolean) || '';
    all.push(n); map.set(n.key, n); return n;
  };
  rows.forEach((r, i) => {
    let segs = parseWbs(r.wbs);
    if (!segs.length) segs = ['~', 'nowbs', 'r' + r.row];   // WBS未入力 → 「WBS未設定」配下のLV3
    let key = segs.join('.');
    if (map.has(key)) key += '#' + r.row;                   // WBS重複
    add({ ...r, id: 'n' + i, key, segs, level: segs.length, ownS: toNum(r.start), ownE: toNum(r.end) });
  });
  // 親が無ければ仮ノードを生成（LV2名=タスク、LV1名=Category）
  const link = (n) => {
    if (n.level === 1) return;
    const ps = n.segs.slice(0, -1), pk = ps.join('.');
    let p = map.get(pk);
    if (!p) {
      const noWbs = ps[0] === '~';
      p = add({ id: 'v' + pk, key: pk, segs: ps, level: ps.length, virtual: true, ownS: null, ownE: null,
        wbs: noWbs ? '' : pk,
        name: noWbs ? 'WBS未設定' : (ps.length === 2 ? n.task : n.category) || 'WBS ' + pk,
        category: n.category || '', task: ps.length === 2 ? n.task || '' : '', subtask: '', mk: '',
        owner: '', sub: '', status: '', kpi: '', note: '' });
      link(p);
    }
    p.children.push(n);
  };
  [...all].forEach(link);
  const roots = all.filter((n) => n.level === 1);
  const sortRec = (arr) => {
    arr.sort((a, b) => (a.segs[0] === '~') - (b.segs[0] === '~')
      || lastSeg(a).localeCompare(lastSeg(b), 'ja', { numeric: true }) || (a.row || 0) - (b.row || 0));
    arr.forEach((n) => sortRec(n.children));
  };
  sortRec(roots);
  // ロールアップ：自分の値があればそれ、無ければ子の最小〜最大
  const leaves = [];
  const roll = (n) => {
    n.children.forEach(roll);
    n.iss = (n.issue ? 1 : 0) + n.children.reduce((a, c) => a + c.iss, 0);   // 自身＋配下の論点数
    const kids = n.children.filter((c) => c.s != null);
    const cs = kids.length ? Math.min(...kids.map((c) => c.s)) : null;
    const ce = kids.length ? Math.max(...kids.map((c) => c.e)) : null;
    n.s = n.ownS != null ? n.ownS : cs;
    n.e = n.ownE != null ? n.ownE : ce;
    n.autoS = n.ownS == null && cs != null; n.autoE = n.ownE == null && ce != null;
    if (n.s == null) n.s = n.e;
    if (n.e == null) n.e = n.s;
    if (n.s != null && n.e < n.s) [n.s, n.e] = [n.e, n.s];
    if (!n.children.length) {
      n.sk = statusKey(n.status); n.total = 1; n.done = n.sk === 'done' ? 1 : 0; leaves.push(n);
    } else {
      n.total = n.children.reduce((a, c) => a + c.total, 0);
      n.done = n.children.reduce((a, c) => a + c.done, 0);
      n.sk = n.status ? statusKey(n.status)
        : n.done === n.total ? 'done' : n.children.some((c) => c.sk !== 'todo') ? 'doing' : 'todo';
    }
    /* 期限超過は Status が Open / WIP のものだけ。Status 空欄の親は子に期限超過があれば立てる */
    n.overdue = n.status ? (isOpenWip(n.status) && n.e != null && n.e < TODAY) : n.children.some((c) => c.overdue);
  };
  roots.forEach(roll);
  S.roots = roots; S.all = all; S.leaves = leaves;
}

/* ================= Filter ================= */
function filtering() { const f = S.f; return !!(MULTI.some((k) => f[k].length) || f.q.trim() || f.onlyOverdue); }
/* 検索語があるときは折りたたみを無視して該当行をすべて表示 */
const searching = () => !!S.f.q.trim();
const inSel = (arr, v) => !arr.length || arr.includes(v);
function selfMatch(n) {
  const f = S.f, q = f.q.trim().toLowerCase();
  return inSel(f.category, n.category) && inSel(f.task, n.task) &&
    (!f.owner.length || f.owner.includes(n.owner) || f.owner.includes(n.sub)) &&
    inSel(f.status, n.status || BLANK) && (!f.onlyOverdue || n.overdue) &&
    (!q || [n.wbs, n.category, n.task, n.subtask, n.owner, n.sub, n.status, n.kpi, n.note].join(' ').toLowerCase().includes(q));
}
/* KPI用：フィルタに一致する末端タスク */
const matchedLeaves = () => (filtering() ? S.leaves.filter(selfMatch) : S.leaves);
function flatten() {
  const on = filtering(), out = [];
  // 親行は配下に一致があれば表示（検索時のみ親行自身の一致でも表示）
  const vis = (n) => {
    const kid = n.children.map(vis).some(Boolean);
    const self = !n.virtual && (n.children.length ? searching() : true) && selfMatch(n);
    return (n._v = kid || self);
  };
  if (on) S.roots.forEach(vis);
  const walk = (n) => {
    if (on && !n._v) return;
    out.push(n);
    if (!searching() && S.collapsed.has(n.key)) return;
    n.children.forEach(walk);
  };
  S.roots.forEach(walk);
  return out;
}

/* ================= Render ================= */
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const leftW = () => parseInt(getComputedStyle(document.documentElement).getPropertyValue('--left'), 10) || 168;
function calcRange() {
  let mn = TODAY, mx = TODAY;
  S.roots.forEach((n) => { if (n.s != null) { mn = Math.min(mn, n.s); mx = Math.max(mx, n.e); } });
  const a = fromNum(mn), b = fromNum(mx);
  const start = Date.UTC(a.getUTCFullYear(), a.getUTCMonth(), 1) / DAY;
  const end = Date.UTC(b.getUTCFullYear(), b.getUTCMonth() + 2, 0) / DAY; // 翌月末まで余白
  return { start, end, days: end - start + 1 };
}
function render() {
  const sc = $('scroller'), keepT = sc.scrollTop, keepL = sc.scrollLeft;
  const dw = ZOOMS[S.zoom], R = S.range = calcRange(), W = Math.round(R.days * dw), L = leftW();
  const list = flatten();
  renderStats();
  let months = '';
  for (let d = fromNum(R.start); d.getTime() / DAY <= R.end; d = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1))) {
    const s = d.getTime() / DAY, dim = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0)).getUTCDate();
    const m = d.getUTCMonth() + 1, y = d.getUTCFullYear();
    const lb = S.zoom === 'month' ? (m === 1 || s === R.start ? y + '.' : '') + String(m).padStart(2, '0') : y + '.' + String(m).padStart(2, '0');
    months += `<div class="month" style="left:${(s - R.start) * dw}px;width:${dim * dw}px">${lb}</div>`;
  }
  let ticks = '', grid = '';
  for (let n = R.start; n <= R.end; n++) {
    const d = fromNum(n), wd = d.getUTCDay(), x = (n - R.start) * dw;
    if (d.getUTCDate() === 1) grid += `<div class="ml" style="left:${x}px"></div>`;
    if (S.zoom === 'day') {
      if (wd === 0 || wd === 6) grid += `<div class="we" style="left:${x}px;width:${dw}px"></div>`;
      ticks += `<div class="tick${wd === 0 || wd === 6 ? ' we' : ''}${n === TODAY ? ' today' : ''}" style="left:${x}px;width:${dw}px">${d.getUTCDate()}<br>${WD[wd].slice(0, 2)}</div>`;
    } else if (S.zoom === 'week' && wd === 1) {
      grid += `<div class="wl" style="left:${x}px"></div>`;
      ticks += `<div class="tick" style="left:${x + 4}px;width:${7 * dw}px;text-align:left;padding-top:8px">${fmt(n)}</div>`;
    }
  }
  grid += `<div class="td" style="left:${(TODAY - R.start) * dw + dw / 2}px"></div>`;
  const rows = list.length ? list.map((n) => rowHtml(n, R, dw, W)).join('')
    : `<div class="empty" style="position:sticky;left:0;width:min(100vw,${L + W}px)">NO TASKS FOUND</div>`;
  $('chart').style.width = (L + W) + 'px';
  $('chart').innerHTML = `
    <div class="head"><div class="corner">WBS / TASK</div>
      <div class="scale" style="width:${W}px"><div class="months">${months}</div>
      <div class="ticks${S.zoom === 'month' ? ' hide' : ''}">${ticks}</div></div></div>
    <div class="body"><div class="grid" style="left:${L}px;width:${W}px">${grid}</div>${rows}</div>`;
  if (S.toToday) { S.toToday = false; goToday(); } else { sc.scrollTop = keepT; sc.scrollLeft = keepL; }
}
function rowHtml(n, R, dw, W) {
  const hasKids = n.children.length > 0;
  const col = !searching() && S.collapsed.has(n.key);
  const period = n.s != null ? fmt(n.s) + ' – ' + fmt(n.e) : '日付未設定';
  const wbs = n.wbs && `<b>${esc(n.wbs)}</b>`;
  const meta = (n.level === 3 || !hasKids ? [wbs, [n.owner, n.sub].filter(Boolean).map(ownerHtml).join(' / '), period, esc(n.status)] : [wbs, period, n.done + '/' + n.total])
    .filter(Boolean).join('  ·  ');
  let bar;
  if (n.s == null) {
    bar = `<span class="nodate" style="left:${(TODAY - R.start) * dw + 10}px">NO DATE</span>`;
  } else {
    const x = (n.s - R.start) * dw, w = Math.max((n.e - n.s + 1) * dw, 3);
    const pg = hasKids && n.total ? `<span class="pg" style="width:${(n.done / n.total) * 100}%"></span>` : '';
    bar = `<div class="br${n.sk === 'done' ? ' done' : ''}${n.overdue ? ' over' : ''}" style="left:${x}px;width:${w}px">${pg}</div>`
        + `<span class="bl" style="left:${x + w + 8}px">${esc(n.name)}</span>`;
  }
  return `<div class="row l${n.level}${n.mk ? ' ' + MARK[n.mk].cls : ''}${col ? ' collapsed' : ''}" data-id="${esc(n.id)}" data-key="${esc(n.key)}">
    <div class="cl"><span class="ind"></span>
      <span class="tg${hasKids ? '' : ' none'}" data-tg="1">▼</span>
      <div class="txt"><div class="nm">${esc(n.name || '(無題)')}</div><div class="mt">${meta}</div></div>
      ${issHtml(n, col)}${n.overdue ? '<span class="flag" title="期限超過"></span>' : ''}
    </div>
    <div class="ct" style="width:${W}px">${bar}</div></div>`;
}
/* 論点アイコン：自身に論点→「!」、折りたたみ中の親で配下に論点→「!件数」 */
function issHtml(n, col) {
  if (n.issue) return `<span class="iss" data-iss="${esc(n.id)}" aria-label="論点あり">!</span>`;
  if (col && n.iss) return `<span class="iss sum" data-iss="${esc(n.id)}" aria-label="配下に論点${n.iss}件">!${n.iss}</span>`;
  return '';
}
const issuesOf = (n) => { const out = []; const walk = (x) => { if (x.issue) out.push(x); x.children.forEach(walk); }; walk(n); return out; };
const issItem = (x, withName) => `<div class="ti">${withName ? `<span class="tw">${esc(x.wbs || '')} ${esc(x.name || '')}</span>` : ''}${esc(x.issue)}</div>`;
function showTip(el) {
  const n = S.all.find((x) => x.id === el.dataset.iss); if (!n) return;
  const list = issuesOf(n), self = list.length === 1 && list[0] === n, max = 8;
  const tip = $('tip');
  tip.innerHTML = `<div class="th">論点${self ? '' : '（' + list.length + '件）'}</div>`
    + list.slice(0, max).map((x) => issItem(x, !self)).join('')
    + (list.length > max ? `<div class="ti">ほか${list.length - max}件（クリックで詳細）</div>` : '');
  tip.classList.add('open');
  const r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
  let x = r.right + 8, y = r.top - 4;
  if (x + tw > innerWidth - 8) x = Math.max(8, r.left - tw - 8);
  if (y + th > innerHeight - 8) y = Math.max(8, innerHeight - th - 8);
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
const hideTip = () => $('tip').classList.remove('open');
function renderStats() {
  const L = matchedLeaves(), over = L.filter((n) => n.overdue).length, tbd = L.filter((n) => isTBD(n.owner)).length;
  $('stats').innerHTML = `
    <div class="stat" title="${filtering() ? 'フィルタ適用中の件数' : '全件'}"><span class="n">${L.length}</span><span class="l">Tasks</span></div>
    <div class="stat"><span class="n">${L.filter((n) => n.sk === 'doing').length}</span><span class="l">In Progress</span></div>
    <div class="stat${over ? ' alert' : ''}"><span class="n">${over}</span><span class="l">Overdue</span></div>
    <div class="stat${tbd ? ' tbdk' : ''}" title="タスクオーナーがTBDの件数"><span class="n">${tbd}</span><span class="l">TBD</span></div>`;
}
function goToday() {
  if (!S.range) return;
  const sc = $('scroller'), x = (TODAY - S.range.start) * ZOOMS[S.zoom];
  sc.scrollLeft = Math.max(0, x - (sc.clientWidth - leftW()) * 0.25);

/* ================= Detail ================= */
function openDetail(id) {
  const n = S.all.find((x) => x.id === id); if (!n) return;
  const lvl = ['', 'LV1', 'LV2', 'LV3'][n.level];
  const dur = n.s != null ? (n.e - n.s + 1) + '日間' : '';
  const rem = n.e != null && n.sk !== 'done' ? (n.e >= TODAY ? '残り' + (n.e - TODAY) + '日' : (TODAY - n.e) + '日超過') : '';
  const auto = '<span class="auto">AUTO</span>';
  const kv = [
    ['WBS', esc(n.wbs || '—')],
    ['Category', esc(n.category || '—')], ['Task', esc(n.task || '—')],
    ...(n.level >= 3 ? [['Subtask', esc(n.subtask || '—')]] : []),
    ['Owner', n.owner ? ownerHtml(n.owner) : '—'], ['Sub', n.sub ? ownerHtml(n.sub) : '—'],
    ['Start', n.s != null ? fmt(n.s, true) + (n.autoS ? auto : '') : '—'],
    ['End', n.e != null ? fmt(n.e, true) + (n.autoE ? auto : '') : '—'],
    ['Duration', [dur, rem].filter(Boolean).join(' / ') || '—'],
    ['Status', esc(n.status || (n.children.length ? ST_LABEL[n.sk] + '（自動）' : '—'))],
  ];
  if (n.children.length) kv.push(['Progress', n.done + ' / ' + n.total + '（' + Math.round(n.done / n.total * 100) + '%）']);
  kv.push(['KPI', esc(n.kpi || '—')]);
  if (n.note && n.note !== n.issue) kv.push(['Note', esc(n.note)]);
  const il = issuesOf(n), self = il.length === 1 && il[0] === n;
  const issBox = il.length ? `<div class="issbox"><div class="th">論点${self ? '' : '（' + il.length + '件）'}</div>${il.map((x) => issItem(x, !self)).join('')}</div>` : '';
  $('detail').innerHTML = `
    <div class="eyebrow">${lvl}${n.virtual ? ' — Auto Generated' : ''}</div>
    <h3>${esc(n.name || '(無題)')}</h3>
    <div class="tags"><span class="tag inv">${lvl}</span>${n.mk ? `<span class="tag ${MARK[n.mk].cls}">${MARK[n.mk].label}</span>` : ''}${n.level > 1 && n.category ? `<span class="tag">${esc(n.category)}</span>` : ''}<span class="tag">${esc(ST_LABEL[n.sk])}</span>${n.overdue ? '<span class="tag al">OVERDUE</span>' : ''}</div>
    ${issBox}<dl class="kv">${kv.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>
    <button class="pbtn" id="btnClose">Close</button>`;
  hideTip();
  $('detailOv').classList.add('open');
  $('btnClose').onclick = closeDetail;
}
const closeDetail = () => $('detailOv').classList.remove('open');

/* ================= UI ================= */
function buildFilterOptions() {
  MULTI.forEach((k) => {
    let vals;
    if (k === 'owner') vals = S.leaves.flatMap((t) => [t.owner, t.sub]).filter(Boolean);
    else if (k === 'status') vals = S.leaves.map((t) => t.status || BLANK);
    else vals = S.leaves.map((t) => t[k]).filter(Boolean);
    vals = [...new Set(vals)];
    if (k === 'status') {
      const order = { todo:0, doing:1, late:2, other:3, hold:4, done:5 };
      vals.sort((a, b) => (a === BLANK) - (b === BLANK) || order[statusKey(a)] - order[statusKey(b)] || a.localeCompare(b, 'ja'));
    } else vals.sort((a, b) => a.localeCompare(b, 'ja'));
    S.opts[k] = vals;
    S.f[k] = S.f[k].filter((v) => vals.includes(v));
  });
  if (S.f.statusDefault) S.f.status = defaultStatus();
  MULTI.forEach(renderMs);
}
/* 既定のStatus選択：Pending・Close 以外すべて（空欄を含む） */
const defaultStatus = () => (S.opts.status || []).filter((v) => !(v && DEFAULT_EXCLUDE_SK.includes(statusKey(v))));
const msLabel = (k, v) => (k === 'status' && v === BLANK ? BLANK_LABEL : v);
function renderMs(k) {
  const el = document.querySelector(`.ms[data-k="${k}"]`), vals = S.opts[k] || [], sel = S.f[k];
  const all = !sel.length;
  const txt = all ? 'All' : sel.length === 1 ? msLabel(k, sel[0]) : `${msLabel(k, sel[0])} ほか${sel.length - 1}件`;
  const open = el.classList.contains('open');
  el.classList.toggle('on', !all);
  el.innerHTML = `<button type="button" class="ms-btn" title="${esc(all ? 'All' : sel.map((v) => msLabel(k, v)).join(', '))}">${esc(txt)}</button>
    <div class="ms-pop"><div class="ms-act"><button type="button" data-act="all">すべて</button>${k === 'status' ? '<button type="button" data-act="def">初期値</button>' : ''}</div>
    ${vals.map((v, i) => `<label class="ms-opt"><input type="checkbox" data-i="${i}"${all || sel.includes(v) ? ' checked' : ''}><span class="${v === BLANK ? 'bl0' : ''}">${esc(msLabel(k, v))}</span></label>`).join('')}</div>`;
  el.classList.toggle('open', open);
}
/* チェック操作：全選択または全解除になったら「すべて」（=フィルタなし）に戻す */
function toggleMs(k, v) {
  const vals = S.opts[k] || [], cur = S.f[k].length ? S.f[k] : vals.slice();
  let next = cur.includes(v) ? cur.filter((x) => x !== v) : [...cur, v];
  next = vals.filter((x) => next.includes(x));
  S.f[k] = next.length === vals.length || !next.length ? [] : next;
  if (k === 'status') S.f.statusDefault = false;
}
function bindMs() {
  document.querySelectorAll('.ms').forEach((el) => {
    const k = el.dataset.k;
    el.addEventListener('click', (e) => {
      if (e.target.closest('.ms-btn')) {
        const was = el.classList.contains('open');
        document.querySelectorAll('.ms.open').forEach((m) => m.classList.remove('open'));
        el.classList.toggle('open', !was); return;
      }
      const act = e.target.closest('[data-act]');
      if (act) {
        S.f[k] = act.dataset.act === 'def' ? defaultStatus() : [];
        if (k === 'status') S.f.statusDefault = act.dataset.act === 'def';
        renderMs(k); render(); return;
      }
    });
    el.addEventListener('change', (e) => {
      const i = e.target.dataset.i; if (i == null) return;
      toggleMs(k, (S.opts[k] || [])[+i]); renderMs(k); render();
    });
  });
  document.addEventListener('click', (e) => { if (!e.target.closest('.ms')) document.querySelectorAll('.ms.open').forEach((m) => m.classList.remove('open')); });
}
function setDepth(d) {
  S.collapsed.clear();
  S.all.forEach((n) => { if (n.children.length && n.level >= d) S.collapsed.add(n.key); });
  savePrefs(); render();
}
function bindUI() {
  syncControls();
  $('zoom').addEventListener('click', (e) => { const z = e.target.dataset.z; if (!z) return; S.zoom = z; S.toToday = true; savePrefs(); syncControls(); render(); });
  $('btnToday').onclick = goToday;
  $('btnL1').onclick = () => setDepth(1);
  $('btnL2').onclick = () => setDepth(2);
  $('btnL3').onclick = () => setDepth(9);
  $('btnFilter').onclick = () => { $('filters').classList.toggle('open'); $('btnFilter').classList.toggle('on'); };
  bindMs();
  $('onlyOverdue').onchange = (e) => { S.f.onlyOverdue = e.target.checked; render(); };
  let tm; $('q').addEventListener('input', (e) => { clearTimeout(tm); tm = setTimeout(() => { S.f.q = e.target.value; render(); }, 200); });
  $('btnClear').onclick = () => { S.f = newFilter(); $('q').value = ''; syncControls(); buildFilterOptions(); render(); };
  $('chart').addEventListener('mouseover', (e) => { const ic = e.target.closest('.iss'); if (ic) showTip(ic); });
  $('chart').addEventListener('mouseout', (e) => { if (e.target.closest('.iss')) hideTip(); });
  $('scroller').addEventListener('scroll', hideTip, { passive: true });
  $('chart').addEventListener('click', (e) => {
    const ic = e.target.closest('.iss'); if (ic) { hideTip(); return openDetail(ic.dataset.iss); }   // 論点アイコン→詳細
    const row = e.target.closest('.row'); if (!row) return;
    const n = S.all.find((x) => x.id === row.dataset.id); if (!n) return;
    // 親行(LV1/LV2)：左の名前欄タップ→開閉、右のバー領域タップ→詳細
    if (n.children.length && e.target.closest('.cl')) {
      if (searching()) return openDetail(n.id);
      S.collapsed.has(n.key) ? S.collapsed.delete(n.key) : S.collapsed.add(n.key);
      savePrefs(); render(); return;
    }
    openDetail(n.id);
  });
  $('detailOv').addEventListener('click', (e) => { if (e.target === $('detailOv')) closeDetail(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeDetail(); hideTip(); document.querySelectorAll('.ms.open').forEach((m) => m.classList.remove('open')); } });
  $('btnReload').onclick = () => { const pw = localStorage.getItem(PW_KEY); pw ? fetchData(pw) : showLogin(); };
  $('btnLogout').onclick = () => {
    if (!confirm('保存されたパスワードを削除してログアウトしますか？')) return;
    localStorage.removeItem(PW_KEY); S.roots = []; S.all = []; S.leaves = [];
    $('chart').innerHTML = ''; $('stats').innerHTML = ''; showLogin();
  };
  $('loginForm').addEventListener('submit', (e) => { e.preventDefault(); const pw = $('pw').value; if (pw) { $('loginMsg').textContent = ''; fetchData(pw); } });
  let lastL = leftW(), rt;
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { const l = leftW(); if (l !== lastL && S.all.length) { lastL = l; render(); } }, 150); });
}
function syncControls() {
  document.querySelectorAll('#zoom button').forEach((b) => b.classList.toggle('on', b.dataset.z === S.zoom));
  $('onlyOverdue').checked = S.f.onlyOverdue;
}
function loadPrefs() {
  try {
    const p = JSON.parse(localStorage.getItem(PREF_KEY) || '{}');
    if (p.zoom in ZOOMS) S.zoom = p.zoom;
    if (Array.isArray(p.collapsed)) S.collapsed = new Set(p.collapsed);
  } catch (_) {}
}
function savePrefs() { localStorage.setItem(PREF_KEY, JSON.stringify({ zoom: S.zoom, collapsed: [...S.collapsed] })); }
function showLogin(msg) { $('loginMsg').textContent = msg || ''; $('pw').value = ''; $('loginOv').classList.add('open'); setTimeout(() => $('pw').focus(), 50); }
const hideLogin = () => $('loginOv').classList.remove('open');
const setLoading = (on) => $('loading').classList.toggle('on', on);
function showError(msg) {
  $('chart').style.width = '100%';
  $('chart').innerHTML = `<div class="errbox">ERROR — ${esc(msg)}<br><br><button class="txtbtn" id="btnRetry">Retry</button></div>`;
  $('btnRetry').onclick = () => $('btnReload').click();
}
</script>
</body>
